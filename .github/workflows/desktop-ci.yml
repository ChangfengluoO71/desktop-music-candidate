name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_version:
        description: "Windows package version (numeric major.minor.patch)"
        required: true
        type: string
        default: "0.0.1"
      publish_preview:
        description: "Publish this build as a GitHub prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run full test suite
        run: .\gradlew.bat --no-daemon test --rerun-tasks

  installer:
    name: Build and test Inno Setup installer
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build app image with bundled runtime
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          if ($env:PREVIEW_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Version must be numeric major.minor.patch, for example 0.0.1.'
          }
          .\gradlew.bat --no-daemon "-PreleaseVersion=$env:PREVIEW_VERSION" createDistributable

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Compile and smoke-test installer
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss" "/DMyAppVersion=$env:PREVIEW_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          $installer = ".\build\installer\DesktopMusicCandidate-$env:PREVIEW_VERSION-Setup.exe"
          .\scripts\smoke-test-windows-installer.ps1 -InstallerPath $installer

      - name: Upload short-lived installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-music-candidate-inno-setup-v${{ inputs.preview_version }}-${{ github.sha }}
          path: build/installer/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    name: Publish GitHub preview release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
    needs: installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source to inspect existing release tags
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-music-candidate-inno-setup-v${{ inputs.preview_version }}-${{ github.sha }}
          path: release-assets

      - name: Publish prerelease and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          $tag = "v$env:PREVIEW_VERSION"
          $existingTag = git ls-remote --exit-code origin "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists; refusing to replace a published version."
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Could not verify whether tag $tag already exists."
          }
          $installer = Get-ChildItem release-assets -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer artifact is missing.'
          }
          gh release create $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --title "Desktop Music Candidate $tag (Preview)" --notes "Windows preview installer built with Inno Setup 6. The installer includes the Java runtime, lets you select the install directory, creates Start Menu and optional desktop shortcuts, and provides an uninstaller. Installation requires administrator approval. The application is an early preview and is not a stable version." --prerelease --latest=false --target $env:GITHUB_SHA
