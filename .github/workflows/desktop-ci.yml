name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Windows package version (numeric major.minor.patch)"
        required: true
        type: string
        default: "0.0.2"
      update_channel:
        description: "Update channel embedded in the application"
        required: true
        type: choice
        options:
          - stable
          - preview
        default: stable
      runtime_artifact_run_id:
        description: "Optional successful native-runtime run ID to reuse when resuming packaging"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish this build as a GitHub release"
        required: true
        type: choice
        options:
          - build_only
          - publish
        default: build_only

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run full test suite
        run: .\gradlew.bat --no-daemon test --rerun-tasks

      - name: Upload JUnit results for CI diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-${{ github.run_id }}
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  native-runtime:
    name: Build pinned LGPL libmpv runtime
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_artifact_run_id == ''
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            tar
            binutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-libwinpthread
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-xz

      - name: Verify native shader build dependencies
        shell: msys2 {0}
        run: |
          python -c "import jinja2; print(f'Jinja2 {jinja2.__version__} ready')"
          test -s "$MINGW_PREFIX/include/vulkan/vulkan.h"
          test -s "$MINGW_PREFIX/share/licenses/vulkan-headers/LICENSE"

      - name: Build stable LGPL runtime from pinned sources
        shell: msys2 {0}
        run: bash scripts/build-release-libmpv.sh

      - name: Upload native runtime and corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: dmc-lgpl-libmpv-${{ github.sha }}
          path: build/release-libmpv/
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Build and test Inno Setup installer
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.test.result == 'success' &&
      (needs.native-runtime.result == 'success' || needs.native-runtime.result == 'skipped')
    needs: [test, native-runtime]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate reused native-runtime build
        if: inputs.runtime_artifact_run_id != ''
        id: validate-native-run
        uses: actions/github-script@v8
        env:
          RUNTIME_ARTIFACT_RUN_ID: ${{ inputs.runtime_artifact_run_id }}
        with:
          script: |
            const runId = Number(process.env.RUNTIME_ARTIFACT_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) {
              throw new Error('The reused native-runtime run ID must be a positive integer.');
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.status !== 'completed' || run.event !== 'workflow_dispatch' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/desktop-ci.yml' ||
                run.head_repository?.full_name?.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) {
              throw new Error('The selected artifact must come from a completed Desktop CI dispatch on this repository main branch.');
            }
            const { data: jobList } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: runId });
            const nativeJob = jobList.jobs.find(job => job.name === 'Build pinned LGPL libmpv runtime');
            if (nativeJob?.conclusion !== 'success') {
              throw new Error('The selected run does not contain a successful native-runtime build.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: runId });
            const expectedName = `dmc-lgpl-libmpv-${run.head_sha}`;
            const artifact = artifacts.find(candidate => candidate.name === expectedName && !candidate.expired);
            if (!artifact) {
              throw new Error(`The selected run is missing the unexpired ${expectedName} artifact.`);
            }
            core.setOutput('source-sha', run.head_sha);
            core.setOutput('artifact-name', artifact.name);

      - name: Confirm native build inputs are unchanged
        if: inputs.runtime_artifact_run_id != ''
        env:
          NATIVE_SOURCE_SHA: ${{ steps.validate-native-run.outputs.source-sha }}
        run: |
          git merge-base --is-ancestor $env:NATIVE_SOURCE_SHA $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'The reusable native runtime must come from this branch history.'
          }
          # The payload assertion runs against the downloaded artifact below, so its checks can evolve independently of native build inputs.
          git diff --quiet $env:NATIVE_SOURCE_SHA $env:GITHUB_SHA -- scripts/build-release-libmpv.sh THIRD_PARTY.md docs/testing/libmpv-runtime.md
          if ($LASTEXITCODE -ne 0) {
            throw 'Native build or license inputs changed; rebuild libmpv from current sources.'
          }

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download native runtime and corresponding source
        if: inputs.runtime_artifact_run_id == ''
        uses: actions/download-artifact@v8
        with:
          name: dmc-lgpl-libmpv-${{ github.sha }}
          path: build/release-libmpv

      - name: Reuse native runtime and corresponding source from prior run
        if: inputs.runtime_artifact_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.validate-native-run.outputs.artifact-name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_artifact_run_id }}
          path: build/release-libmpv

      - name: Build app image with bundled runtime
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Version must be numeric major.minor.patch, for example 0.0.1.'
          }
          .\gradlew.bat --no-daemon "-PreleaseVersion=$env:RELEASE_VERSION" "-PupdateChannel=$env:UPDATE_CHANNEL" createDistributable

      - name: Test staged libmpv against generated fixtures
        env:
          MPV_LIBRARY: ${{ github.workspace }}\build\release-libmpv\runtime\libmpv-2.dll
          MPV_SOURCE_ARCHIVE: ${{ github.workspace }}\build\release-libmpv\libmpv-corresponding-source.tar.gz
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: .\gradlew.bat --no-daemon "-PreleaseVersion=$env:RELEASE_VERSION" "-PupdateChannel=$env:UPDATE_CHANNEL" "-PmpvLibrary=$env:MPV_LIBRARY" "-PmpvArchive=$env:MPV_SOURCE_ARCHIVE" nativeMpvPoc

      - name: Assert Gradle, generated metadata, and release tag version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: |
          $buildInfoPath = ".\build\generated\sources\buildInfo\kotlin\com\qing\hachimi\desktop\BuildInfo.kt"
          if (-not (Test-Path $buildInfoPath)) { throw 'Generated BuildInfo.kt is missing.' }
          $buildInfo = Get-Content $buildInfoPath -Raw
          $versionMatch = [regex]::Match($buildInfo, 'const val VERSION: String = "([^"]+)"')
          $channelMatch = [regex]::Match($buildInfo, 'const val CHANNEL: String = "([^"]+)"')
          $commitMatch = [regex]::Match($buildInfo, 'const val COMMIT: String = "([^"]+)"')
          if (-not $versionMatch.Success -or $versionMatch.Groups[1].Value -ne $env:RELEASE_VERSION) { throw 'Gradle and BuildInfo versions differ.' }
          if (-not $channelMatch.Success -or $channelMatch.Groups[1].Value -ne $env:UPDATE_CHANNEL) { throw 'BuildInfo update channel differs from the selected release channel.' }
          if (-not $commitMatch.Success -or $commitMatch.Groups[1].Value -ne $env:GITHUB_SHA) { throw 'BuildInfo commit does not match the checked out source commit.' }
          $releaseTag = "v$env:RELEASE_VERSION"
          if ($releaseTag -ne "v$($versionMatch.Groups[1].Value)") { throw 'Release tag and application version differ.' }

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Compile and smoke-test installer
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_NATIVE_SOURCE_SHA: ${{ steps.validate-native-run.outputs.source-sha || github.sha }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss" "/DMyAppVersion=$env:RELEASE_VERSION" "/DIncludeReleaseMpv"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          $installer = ".\build\installer\DesktopMusicCandidate-$env:RELEASE_VERSION-Setup.exe"
          if (-not (Test-Path $installer)) { throw 'Inno Setup did not produce the installer with the requested version.' }
          .\scripts\smoke-test-windows-installer.ps1 -InstallerPath $installer -ExpectedSourceCommit $env:EXPECTED_NATIVE_SOURCE_SHA
          $releaseAssets = ".\build\release-assets"
          New-Item -ItemType Directory -Path $releaseAssets -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination $releaseAssets
          Copy-Item -LiteralPath ".\build\release-libmpv\libmpv-corresponding-source.tar.gz" -Destination $releaseAssets
          Copy-Item -LiteralPath ".\build\release-libmpv\runtime\runtime-manifest.json" -Destination (Join-Path $releaseAssets "libmpv-runtime-manifest.json")
          Get-ChildItem $releaseAssets -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content -LiteralPath "$releaseAssets\SHA256SUMS.txt" -Encoding ascii

      - name: Upload short-lived installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-music-candidate-inno-setup-v${{ inputs.release_version }}-${{ github.sha }}
          path: build/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'publish'
    needs: installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source to inspect existing release tags
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download installer and source artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-music-candidate-inno-setup-v${{ inputs.release_version }}-${{ github.sha }}
          path: release-assets

      - name: Publish stable release or preview and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $existingTag = git ls-remote --exit-code origin "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists; refusing to replace a published version."
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Could not verify whether tag $tag already exists."
          }
          $installer = Get-ChildItem release-assets -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer artifact is missing.'
          }
          if (-not (Test-Path 'release-assets\libmpv-corresponding-source.tar.gz') -or -not (Test-Path 'release-assets\libmpv-runtime-manifest.json') -or -not (Test-Path 'release-assets\SHA256SUMS.txt')) {
            throw 'The release is missing the native runtime source, provenance manifest, or checksum file.'
          }
          foreach ($line in Get-Content 'release-assets\SHA256SUMS.txt') {
            $parts = $line -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Malformed checksum line: $line" }
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release-assets' $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Release asset checksum mismatch: $($parts[1])" }
          }
          if ($env:UPDATE_CHANNEL -eq 'stable') {
            $title = "DMC $tag"
            $notes = "Official stable DMC release. The Windows Inno Setup installer includes a pinned LGPL libmpv runtime, its corresponding source archive and license notices, the Java runtime, selectable installation directory, Start Menu shortcuts, and uninstaller. SHA256SUMS.txt contains hashes for release assets."
            gh release create $tag $installer.FullName 'release-assets\libmpv-corresponding-source.tar.gz' 'release-assets\libmpv-runtime-manifest.json' 'release-assets\SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:GITHUB_SHA
          } else {
            $title = "DMC $tag (Preview)"
            $notes = "DMC preview installer built with Inno Setup 6. This release may contain incomplete features and is intended for evaluation."
            gh release create $tag $installer.FullName 'release-assets\libmpv-corresponding-source.tar.gz' 'release-assets\libmpv-runtime-manifest.json' 'release-assets\SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease --latest=false --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
          $publishedJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the published release (exit code $LASTEXITCODE)." }
          $published = $publishedJson | ConvertFrom-Json
          if ($published.tagName -ne $tag -or $published.isDraft) { throw 'The published release tag or visibility is incorrect.' }
          if ($env:UPDATE_CHANNEL -eq 'stable' -and $published.isPrerelease) { throw 'The stable release was incorrectly published as a prerelease.' }
          if (-not (@($published.assets | Where-Object { $_.name -eq $installer.Name }).Count)) { throw 'The published release is missing its exact Windows installer asset.' }
